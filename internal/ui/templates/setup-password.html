{{define "content"}}
<div class="auth-shell">
  <div class="brand-lg"><img class="ico" src="/favicon.svg" alt="" width="28" height="28"><span class="name">Auth</span></div>

  {{with .PasswordSetup}}
  {{if .ErrorTitle}}
  <div class="card" id="setup-error">
    <h2>{{.ErrorTitle}}</h2>
    <p class="dim" style="margin-top:8px">{{.ErrorMessage}}</p>
    <a class="btn" href="/web/login" style="width:100%;margin-top:14px">前往登录</a>
  </div>
  {{else}}
  <div class="card" id="setup-card">
    <h2>设置新密码</h2>
    <p class="dim" style="margin-top:6px">管理员已重置 <span class="mono">{{.Email}}</span> 的密码。设置新密码后即可登录。</p>
    <form method="post" action="/web/setup-password" style="margin-top:12px" novalidate>
      <input type="hidden" name="token" value="{{.Token}}">
      <label class="field"><span>新密码（至少 8 位）</span>
        <input type="password" name="password" autocomplete="new-password" minlength="8" required>
      </label>
      {{if .Error}}<p class="err" role="alert">{{.Error}}</p>{{end}}
      <button type="submit" class="btn primary" style="width:100%">完成设置</button>
    </form>
    <p class="hint" style="margin-top:12px">链接 1 小时内有效，仅可使用一次。非本人操作请联系管理员。</p>
  </div>
  {{end}}
  {{end}}
</div>
{{end}}
