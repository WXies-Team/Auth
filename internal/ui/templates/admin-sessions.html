{{define "content"}}
<div class="page-head">
  <h1>会话总览</h1>
  <span class="dim" id="sess-total" aria-live="polite"></span>
</div>

<p class="hint">按用户聚合展示活跃会话，点「查看会话」钻取到设备逐条退出；顶部项目切换器只过滤授权范围内的会话。</p>

<!-- 概览指标：四项全部取 GET /admin/sessions 的服务端聚合（与搜索/项目筛选同源），
     标题统一写「当前筛选」——不拿一页数据冒充全量。 -->
<div class="kpi-row" id="sess-kpis" aria-live="polite">
  <div class="card kpi"><strong id="sess-kpi-sessions">—</strong><span class="hint">活跃会话（当前筛选）</span></div>
  <div class="card kpi"><strong id="sess-kpi-users">—</strong><span class="hint">有活跃会话的用户</span></div>
  <div class="card kpi"><strong id="sess-kpi-projects">—</strong><span class="hint">覆盖项目（当前筛选）</span></div>
  <div class="card kpi"><strong id="sess-kpi-regions">—</strong><span class="hint">覆盖归属地（当前筛选）</span></div>
</div>

<!-- 层级一：用户列表 -->
<div id="sess-users-view">
  <form class="toolbar" id="sess-user-search-form" role="search">
    <div class="toolbar-row">
      <label class="field"><span>用户</span>
        <input type="text" id="sess-user-query" placeholder="邮箱片段或 uid" autocomplete="off">
      </label>
      <label class="field"><span>IP</span>
        <input type="text" id="sess-user-ip" placeholder="如 114.86 或 2408:" autocomplete="off">
      </label>
    </div>
    <div class="toolbar-actions">
      <button type="submit" class="btn primary">{{icon "search"}} 搜索</button>
    </div>
  </form>

  <p class="err" id="sess-error" role="alert" hidden></p>
  <!-- 拒绝态内联面板（403 分级 + 下一步动作），由 app.js 注入 -->
  <div class="denied-slot" id="sess-denied" hidden></div>

  <div class="table-wrap">
    <table>
      <caption class="sr-only">有活跃会话的用户</caption>
      <thead>
        <tr><th>用户</th><th>uid</th><th>会话数</th><th>覆盖项目</th><th>主要归属地</th><th>最近活跃</th><th></th></tr>
      </thead>
      <tbody id="sess-users-body">
        <tr><td colspan="7"><span class="skeleton sk-line w60"></span><span class="skeleton sk-line w40"></span></td></tr>
        <tr><td colspan="7"><span class="skeleton sk-line w60"></span><span class="skeleton sk-line w40"></span></td></tr>
        <tr><td colspan="7"><span class="skeleton sk-line w60"></span><span class="skeleton sk-line w40"></span></td></tr>
      </tbody>
    </table>
  </div>

  <div class="pager" style="margin-top:10px">
    <button type="button" class="btn small" id="sess-prev">上一页</button>
    <span class="dim" id="sess-page">—</span>
    <button type="button" class="btn small" id="sess-next">下一页</button>
  </div>
</div>

<!-- 单条退出的确认（点名设备再动手） -->
<dialog class="dlg" id="sd-kick-dialog" aria-labelledby="sd-kick-title">
  <h2 id="sd-kick-title">退出会话</h2>
  <p id="sd-kick-desc" class="dim"></p>
  <div class="dlg-actions">
    <button type="button" class="btn" id="sd-kick-cancel">取消</button>
    <button type="button" class="btn danger" id="sd-kick-ok">确认退出</button>
  </div>
</dialog>

<!-- 全量退出的确认（平台管理员 · 该用户全部设备一次退出，点名用户与条数） -->
<dialog class="dlg" id="sd-all-dialog" aria-labelledby="sd-all-title">
  <h2 id="sd-all-title">退出该用户全部会话</h2>
  <p id="sd-all-desc" class="dim"></p>
  <div class="dlg-actions">
    <button type="button" class="btn" id="sd-all-cancel">取消</button>
    <button type="button" class="btn danger" id="sd-all-ok">确认全部退出</button>
  </div>
</dialog>

<!-- 层级二：单用户会话列表（页内钻取）：归属地分布 + 逐条退出 + 全量退出 -->
<section class="card detail hidden" id="sess-detail" aria-labelledby="sd-title" aria-live="polite">
  <div class="row between">
    <h2 id="sd-title">用户会话</h2>
    <button type="button" class="btn ghost" id="sd-close">返回用户列表</button>
  </div>
  <p class="hint" id="sd-meta"></p>

  <!-- 归属地分布：该用户全部会话按 ipRegion 聚合（服务端离线库现算的字段） -->
  <div class="hidden" id="sd-region">
    <h3>归属地分布</h3>
    <div class="bars" id="sd-region-bars"></div>
  </div>

  <div class="list" id="sd-body"></div>

  <div class="row" id="sd-actions" style="margin-top:12px">
    <!-- 全量退出走 POST /admin/users/{uid}/revoke-sessions（平台管理员专属）；
         项目管理员的 HTML 里由 app.js 隐藏此钮并换成范围说明 -->
    <button type="button" class="btn danger hidden" id="sd-kick-all">退出该用户全部会话</button>
    <span class="hint" id="sd-scope-hint" hidden>项目管理员可逐条退出本项目会话；全量退出由平台管理员执行。</span>
  </div>
</section>
{{end}}
