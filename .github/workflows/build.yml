name: build

# Go 服务的编译 + 测试门禁。纯文档与 workflow 自身的改动不触发（跑不出字节差异，
# 只占 runner）；文档类改动请用 `docs:` 前缀提交。
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 版本从 go.mod 读（单一来源，不会与本地开发版本飘掉）。真库测试需要
      # TEST_MYSQL_DSN，CI 上没有 MySQL 会自动 Skip——但其余测试照跑。
      # **必须显式给 HOME**：本仓库的 self-hosted runner 里，真正执行 step 的那个进程
      # 没有 HOME（坑与热量日记服务同款），go 会以「GOCACHE is not defined」失败。
      # HOME 指到工作区旁持久目录：GOMODCACHE/GOCACHE 跨 run 留存，go mod 不再每 run
      # 重下；本地即缓存 → setup-go 远端 actions/cache 关闭。
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
        env:
          HOME: ${{ github.workspace }}/../go-home

      - name: Build & Test
        env:
          HOME: ${{ github.workspace }}/../go-home
        run: |
          go build ./...
          go test ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web build, unit & e2e
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
          npx playwright install --with-deps chromium
          npm run e2e

      # dist 是随二进制提交的产物：源码改了没重建，这里直接红，避免线上跑旧 UI。
      - name: Dist must be committed
        run: git diff --exit-code -- internal/ui/dist
